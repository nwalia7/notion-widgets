<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    .player {
      width: 100%;
      height: 352px;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 352px;
      border: 0;
    }
  </style>
</head>

<body>
  <div class="player">
    <iframe
      src="https://open.spotify.com/embed/playlist/6yLXgwInQTVrdKI0uut0PG?utm_source=generator&theme=0&si=010c5832231148a7"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
